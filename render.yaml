services:
  - type: web
    name: prospectar
    runtime: node
    branch: main
    buildCommand: npm --prefix frontend ci && npm --prefix backend ci && npm --prefix frontend run build && npm --prefix backend run migrate && npm --prefix backend run seed
    startCommand: node backend/src/server.js
    preDeployCommand: npm --prefix backend run migrate && npm --prefix backend run seed
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DB_SSL
        value: "true"
      - key: SERVE_SPA
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
